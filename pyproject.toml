[tool.uv.workspace]
members = ["sdk", "dashboard"]

# ---------------------------------------------------------------------------
# Style / lint config — applies to both workspace members.
#
# The qa/style-modernize branch brought the SDK + dashboard from
# 12,555 ruff findings down to ~1,680 in 2026-05. This config locks in the
# wins (PEP 585 / 604 typing, sorted imports, no orphan typing aliases) and
# documents the explicitly-permitted exceptions so future contributors
# don't reinstate the noise.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  ".evalyn",
  ".gstack",
  "data",
  "local_scripts",
  "example_agents",
]

[tool.ruff.lint]
select = [
  "F",    # pyflakes - real bugs (unused imports, undefined names, ...)
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "I",    # isort - import sorting
  "UP",   # pyupgrade - modern Python syntax
  "B",    # flake8-bugbear - bug-magnet patterns
  "SIM",  # flake8-simplify - obvious simplifications
]
ignore = [
  # E501 (line-too-long): most remaining over-length lines are inside
  # error messages, log strings, or URLs in comments that the formatter
  # leaves alone. A `ruff format` sweep ran 2026-05-20 (516 files
  # reformatted) so structural over-runs are gone; keep this ignored
  # for the string/comment cases that remain by design.
  "E501",
  # E402 (module-import-not-at-top-of-file): ~200 sites, most are
  # legitimate sys.path manipulation, optional-dep `try: import x
  # except ImportError: ...` blocks, or conditional debug imports.
  # Decide per-file rather than blanket-ban.
  "E402",
  # B905 (zip-without-explicit-strict): review-by-review. Some hot
  # loops zip iterables of asserted-equal length and adding
  # strict=True everywhere risks production crashes on data we
  # haven't audited; strict=False would silence the lint but lose
  # the signal.
  "B905",
  # SIM108 (if-else-block-instead-of-if-exp): ternaries are not
  # always clearer; let the reviewer decide.
  "SIM108",
  # SIM105 (suppressible-exception): contextlib.suppress isn't
  # always the right call when the except body does anything
  # besides `pass`.
  "SIM105",
  # SIM102 (collapsible-if): nested ifs often read better than
  # `and` chains when each level has its own semantics.
  "SIM102",
  # SIM103 (needless-bool): the early-return guard pattern
  # (`if cond_A: return False; if cond_B: return False; return True`)
  # often reads more clearly than ruff's flattened
  # `return not (cond_A or cond_B)`. Single-condition variants
  # (`if x: return True; return False`) should still be cleaned up
  # by hand at the call site; we just don't let the linter force the
  # rewrite of multi-guard functions.
  "SIM103",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F841", "B007", "E741"]
"**/conftest.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
