name: secret-scan

# Server-side secret detection. Runs on every push and PR; cannot be
# bypassed via `git commit --no-verify`. Local `pre-commit` is the
# fast feedback layer; this workflow is the durable enforcement layer.
#
# Safety note: every `run:` step below uses only hardcoded strings or
# the contents of files already in the checked-out tree. No github
# event fields (issue.title, pull_request.body, head_ref, etc.) are
# interpolated into shell commands, so this workflow is not exposed
# to the workflow-injection class of vulnerabilities.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install detect-secrets
        run: pip install "detect-secrets==1.5.0"

      - name: Verify baseline exists
        run: |
          if [ ! -f .secrets.baseline ]; then
            echo "::error::.secrets.baseline missing - run: detect-secrets scan --baseline .secrets.baseline"
            exit 1
          fi

      - name: Scan tree for new secrets vs baseline
        run: |
          detect-secrets scan \
            --baseline .secrets.baseline \
            --exclude-files '\.venv/|node_modules/|__pycache__/|dashboard/frontend/dist/|dashboard/evalyn_dashboard/static/|.*/\.venv/' \
            > /tmp/baseline.new
          python -c "
          import json, sys
          old = json.load(open('.secrets.baseline')).get('results', {})
          new = json.load(open('/tmp/baseline.new')).get('results', {})
          old_keys = {(f, h['hashed_secret']) for f, hits in old.items() for h in hits}
          new_keys = {(f, h['hashed_secret']) for f, hits in new.items() for h in hits}
          delta = new_keys - old_keys
          if delta:
              print('::error::New secret-shaped strings detected (not in .secrets.baseline):')
              for f, h in sorted(delta):
                  print(f'  {f} :: hash={h[:12]}...')
              print('If false-positive: update .secrets.baseline (see CONTRIBUTING.md)')
              sys.exit(1)
          print('No new secrets detected.')
          "
