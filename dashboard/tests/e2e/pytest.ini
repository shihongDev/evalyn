; Playwright E2E config for the dashboard happy-path suite (Lane D1.3).
;
; Defaults assume CI: headless Chromium, ignore HTTPS errors (we hit
; http://127.0.0.1:<port>). pytest-playwright wires these via CLI flags
; under the covers.
;
; Local override: ``uv run pytest dashboard/tests/e2e --headed`` to watch
; the browser drive the form.

[pytest]
addopts = --browser=chromium
testpaths = .
asyncio_mode = strict
