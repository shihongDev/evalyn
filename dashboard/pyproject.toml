[project]
name = "evalyn-dashboard"
version = "0.1.0"
description = "Localhost IDE for evalyn evaluations"
requires-python = ">=3.10"
dependencies = [
  "evalyn-sdk",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "websockets>=12",
  "openai>=1.10",
  "anthropic>=0.20",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "jsonschema>=4.0",
  "playwright>=1.40",
  "pytest-playwright>=0.4",
]

[project.entry-points."evalyn.commands"]
dashboard = "evalyn_dashboard.cli_command"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evalyn_dashboard*"]

[tool.setuptools.package-data]
evalyn_dashboard = ["static/**/*"]

[tool.uv.sources]
evalyn-sdk = { workspace = true }
