# Test config: Bundle mode (no LLM required)
# Tests: dataset build + bundle metric selection + eval

api_keys:
  gemini: null  # Not needed for bundle mode with objective metrics

llm:
  model: "gemini-2.5-flash-lite"
  mode: "api"

defaults:
  project: null
  version: null

metrics:
  mode: "bundle"
  bundle: "research-agent"

annotation:
  skip: true

calibration:
  skip: true

simulation:
  enable: false

pipeline:
  auto_yes: true
  verbose: false
